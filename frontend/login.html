<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PatientTriage.ai</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #16213e;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .login-card h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            text-align: center;
        }
        .login-card h2 {
            margin: 0 0 30px 0;
            font-size: 16px;
            color: #a0a0a0;
            text-align: center;
            font-weight: normal;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #2a3a5c;
            border-radius: 4px;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #2563eb;
        }
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>🏥 PatientTriage.ai</h1>
    <h2>Emergency Department Login</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="clinician@H001.hosp" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
        <div id="error-message" class="error-message"></div>
        <div style="margin-top: 15px; text-align: center; font-size: 0.9em;">
        <a href="hospital_portal.html" style="color: #646cff; text-decoration: none;">Are you a Hospital Admin? Go to Hospital Portal</a>
    </div>
</form>
</div>

<script src="login.js"></script>
</body>
</html>
